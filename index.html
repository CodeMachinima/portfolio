<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luke — Portfolio</title>
  <style>
    :root {
      --paper: #f2eee5;
      --ink: #171717;
      --muted: #77736c;
      --acid: #d7f35f;
      --orange: #ff6a35;
      --blue: #89c8ff;
      --line: rgba(23, 23, 23, .76);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    body::before { display: none; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 25px 5vw; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .brand { font-weight: 800; letter-spacing: .02em; font-size: 28px; text-transform: none; }
    .status { display: flex; align-items: center; gap: 10px; }
    .dot { width: 8px; height: 8px; background: var(--orange); border-radius: 50%; display: inline-block; }
    main { max-width: 1440px; margin: auto; padding: 1vh 4vw 70px; }
    .board { position: relative; height: min(70vw, 700px); min-height: 530px; margin-top: 4vh; overflow: hidden; background: transparent; }
    .cross { position: absolute; inset: 10% 10%; display:grid; place-items:center; }
    .cross::before, .cross::after { content:""; position:absolute; background: var(--ink); }
    .cross::before { width: 54%; height: 1.5px; }
    .cross::after { width: 1.5px; height: 54%; }
    .arm { appearance:none; position:absolute; z-index:3; min-width: 150px; padding: 14px 20px; border: 1px solid rgba(23,23,23,.35); border-radius: 3px; background: #f0eef2; color: var(--ink); text-align:center; font-weight: 900; letter-spacing: -.08em; line-height: .8; cursor:pointer; transition: transform .25s ease, color .25s ease; }
    .arm:hover, .arm.active { transform: scale(1.08) rotate(-2deg); color: var(--orange); }
    .arm span { display:block; }
    .top { top: 3%; font-size: clamp(2.5rem, 6vw, 5.8rem); }
    .right { right: 4%; font-size: clamp(2.4rem, 5vw, 5rem); }
    .bottom { bottom: 2%; font-size: clamp(2.5rem, 6vw, 5.8rem); }
    .left { left: 3%; font-size: clamp(2.4rem, 5vw, 5rem); }
    .arrow { position:absolute; font-size: 45px; font-weight: 300; line-height: 1; letter-spacing: 0; }
    .top .arrow { left:50%; bottom:-58px; transform:translateX(-50%); }
    .right .arrow { left:-58px; top:50%; transform:translateY(-50%); }
    .bottom .arrow { left:50%; top:-58px; transform:translateX(-50%); }
    .left .arrow { right:-58px; top:50%; transform:translateY(-50%); }
    .orbit { position:absolute; left:50%; top:50%; width:min(68%, 640px); aspect-ratio:1; transform:translate(-50%, -50%); z-index:1; pointer-events:none; animation: orbit-spin 28s linear infinite; }
    .orbit svg { width:100%; height:100%; overflow:visible; }
    .orbit text { fill:var(--ink); font-family:Georgia, serif; font-size:4.1px; font-style:italic; letter-spacing:.28px; }
    .orbit .orbit-path { fill:none; stroke:rgba(23,23,23,.16); stroke-width:.15; stroke-dasharray:.7 1.4; }
    @keyframes orbit-spin { from { transform:translate(-50%, -50%) rotate(0deg); } to { transform:translate(-50%, -50%) rotate(360deg); } }
    footer { display:flex; justify-content:space-between; padding: 24px 5vw 35px; font-size: 11px; text-transform:uppercase; letter-spacing:.13em; }
    a { color:inherit; text-decoration:none; border-bottom:1px solid currentColor; }
    @media (max-width: 650px) { header {padding: 18px 5vw;} .board {height: 610px; min-height:0;} .cross {inset: 8% 4%;} .top{top:6%;} .bottom{bottom:6%;} .left{left:0;} .right{right:0;} .orbit{width:78%;} footer{gap:20px; flex-direction:column;} }
  </style>
</head>
<body>
  <header><div class="brand">Luke Paz</div><div class="status"><span class="dot"></span> open to making things</div></header>
  <main>
    <section class="board" aria-label="Interactive portfolio map">
      <div class="cross">
        <button class="arm top" data-title="About me" data-copy="A curious maker exploring art, design, and the small details that make a big feeling.">About<br><span>Me</span><span class="arrow">↑</span></button>
        <button class="arm right" data-title="Contact" data-copy="Have an idea, a question, or a good excuse to make something? Say hello."><span class="arrow">→</span>Contact</button>
        <button class="arm bottom" data-title="Socials" data-copy="Find the process, experiments, and in-between moments on the social side of the portfolio."><span class="arrow">↓</span>Socials</button>
        <button class="arm left" data-title="My work" data-copy="Selected work across visual studies, web experiments, and projects made with other people."><span class="arrow">←</span>My<br>Work</button>
      </div>
      <div class="orbit" aria-label="Portfolio keywords"><svg viewBox="0 0 100 100" role="img"><defs><path id="orbit-path" class="orbit-path" d="M50,50 m-43,0 a43,43 0 1,1 86,0 a43,43 0 1,1 -86,0" /></defs><use href="#orbit-path" class="orbit-path" /><text><textPath href="#orbit-path" startOffset="0%">learn more  ·  experiments  ·  visual studies  ·  say hello  ·  play  ·  process  ·  curious  ·  make  ·  </textPath></text></svg></div>
    </section>
  </main>
  <footer><span>© Luke Paz</span><span><a href="mailto:hello@lukepaz.com">hello@lukepaz.com</a> · San José, CA</span></footer>
  <script>
    const title = document.querySelector('#detail-title');
    const copy = document.querySelector('#detail-copy');
    if (title && copy) {
      document.querySelectorAll('[data-title]').forEach((item) => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          title.textContent = item.dataset.title;
          copy.textContent = item.dataset.copy;
        });
      });
    }
  </script>
</body>
</html>
