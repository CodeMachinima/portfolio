<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socials — Luke Paz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap');
    :root { --paper:#000; --ink:#f2eee5; --muted:#9b968d; --gothic:"Cormorant Garamond", Georgia, serif; }
    * { box-sizing:border-box; }
    html { min-height:100%; zoom:50%; }
    body {
      margin:0;
      min-height:100vh;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--gothic);
      overflow-x:hidden;
    }
    a { color:inherit; text-decoration:none; }
    header { display:flex; justify-content:space-between; align-items:flex-start; padding:25px 5vw 0; }
    .brand { font-family:Arial, Helvetica, sans-serif; font-size:28px; font-weight:800; letter-spacing:.02em; }
    .social-title { position:relative; margin:0 1vw 0 0; font-family:var(--gothic); font-size:clamp(3.3rem, 7vw, 6.6rem); font-weight:600; letter-spacing:-.04em; line-height:.9; transform:rotate(-2deg); }
    .scratch { position:absolute; left:-24%; top:-28px; width:150%; height:132px; overflow:visible; pointer-events:none; }
    .scratch path { fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round; }
    .scratch .loop { stroke-width:1.8; }
    .scratch .slash { stroke-width:1.25; }
    main {
      width:min(100% - 10vw, 980px);
      margin:0 auto;
      padding:clamp(100px, 16vh, 190px) 0 100px;
    }
    .social-list {
      display:flex;
      flex-direction:column;
      gap:clamp(28px, 5.5vh, 58px);
      margin:0;
      padding:0;
      list-style:none;
    }
    .social-list li:nth-child(2) { margin-left:clamp(42px, 8vw, 120px); }
    .social-list li:nth-child(3) { margin-left:clamp(84px, 16vw, 240px); }
    .social-list li:nth-child(4) { margin-left:clamp(126px, 24vw, 360px); }
    .social-list li:nth-child(5) { margin-left:clamp(168px, 32vw, 480px); }
    .social-link {
      display:grid;
      grid-template-columns:clamp(44px, 5vw, 64px) 1fr;
      align-items:center;
      column-gap:clamp(20px, 3vw, 38px);
      width:max-content;
      max-width:100%;
      color:var(--ink);
      transition:color .2s ease, transform .2s ease;
    }
    .social-link:hover, .social-link:focus-visible { color:#fff; transform:translateX(8px); }
    .social-link:focus-visible { outline:1px solid var(--ink); outline-offset:10px; }
    .logo {
      display:grid;
      place-items:center;
      width:clamp(44px, 5vw, 64px);
      height:clamp(44px, 5vw, 64px);
    }
    .logo svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2.15; stroke-linecap:round; stroke-linejoin:round; }
    .logo.youtube svg { fill:currentColor; stroke:none; }
    .logo.youtube path:first-child { fill:currentColor; }
    .logo.youtube path:last-child { fill:#000; }
    .logo.twitter svg { fill:currentColor; stroke:none; }
    .logo.bluesky img { display:block; width:100%; height:100%; object-fit:contain; }
    .social-copy { min-width:0; }
    .social-name { font-size:clamp(1.25rem, 2.35vw, 2.2rem); font-weight:800; letter-spacing:-.045em; line-height:.95; white-space:nowrap; }
    .back { position:fixed; left:5vw; bottom:24px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .back::before { content:"←"; display:inline-block; margin-right:8px; font-size:18px; vertical-align:-2px; }
    @media (max-width:650px) {
      header { padding:18px 5vw 0; }
      .brand { font-size:25px; }
      main { width:90vw; padding-top:clamp(90px, 15vh, 150px); }
      .social-title { font-size:clamp(2.9rem, 13vw, 5rem); }
      .scratch { left:-28%; top:-20px; width:160%; height:112px; }
      .social-link { grid-template-columns:42px 1fr; column-gap:18px; width:100%; }
      .logo { width:42px; height:42px; }
      .social-name { font-size:clamp(.9rem, 4.5vw, 1.35rem); letter-spacing:-.04em; }
      .social-list li:nth-child(2) { margin-left:8vw; }
      .social-list li:nth-child(3) { margin-left:16vw; }
      .social-list li:nth-child(4) { margin-left:24vw; }
      .social-list li:nth-child(5) { margin-left:32vw; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">Luke Paz</a>

  <main>

          <span class="social-copy"><span class="social-name">twitter.com/codemachinima</span></span>
        </a>
      </li>
      <li>
        <a class="social-link" href="https://instagram.com/codemachinimaluke" target="_blank" rel="noreferrer" aria-label="Luke Paz on Instagram">
          <span class="logo instagram" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="11"/><circle cx="24" cy="24" r="10"/><circle cx="36" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></span>

          <span class="logo bluesky" aria-hidden="true"><img src="bluesky-white.png" alt="" /></span>
          <span class="social-copy"><span class="social-name">bsky.app/profile/codemachinima.bsky.social</span></span>
        </a>
      </li>
      <li>
        <a class="social-link" href="https://www.linkedin.com/in/luke-isaiah-paz-0ba469200/" target="_blank" rel="noreferrer" aria-label="Luke Paz on LinkedIn">
          <span class="logo linkedin" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="2" y="2" width="44" height="44" rx="3" fill="currentColor" stroke="none"/><circle cx="14" cy="14" r="3" fill="#000" stroke="none"/><path d="M11 20h6v17h-6zM21 20h6v2.3c1.4-1.8 3.5-3 6.4-3 5.2 0 7.6 3.2 7.6 9v8.7h-6v-7.9c0-2.2-.1-5-3.2-5-3.1 0-3.6 2.4-3.6 4.9V37h-6z" fill="#000" stroke="none"/></svg></span>
          <span class="social-copy"><span class="social-name">linkedin.com/in/luke-isaiah-paz-0ba469200/</span></span>

    </ul>
  </main>

</body>
</html>
