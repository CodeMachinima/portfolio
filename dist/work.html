<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Works — Luke Paz</title>
  <style>
    :root { --paper:#f2eee5; --ink:#171717; --muted:#77736c; --line:rgba(23,23,23,.78); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:Arial,Helvetica,sans-serif; overflow-x:hidden; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.2; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E"); z-index:5; mix-blend-mode:multiply; }
    a { color:inherit; text-decoration:none; }
    header { display:flex; justify-content:space-between; align-items:flex-start; padding:25px 5vw 0; }
    .brand { font-size:28px; font-weight:800; letter-spacing:.02em; }
    .work-title { position:relative; margin:0 1vw 0 0; font-family:"Comic Sans MS","Bradley Hand",cursive; font-size:clamp(3.3rem,7vw,6.6rem); font-weight:400; letter-spacing:-.1em; line-height:.9; transform:rotate(-2deg); }
    .scratch { position:absolute; left:-30%; right:-10%; bottom:-30px; width:140%; height:62px; overflow:visible; }
    .scratch path { fill:none; stroke:var(--line); stroke-linecap:round; stroke-width:2.2; }
    main { max-width:1500px; margin:0 auto; padding:8vh 4vw 100px; }
    .section { margin:0 0 105px; }
    .section-heading { display:inline-block; position:relative; margin:0 0 32px; font-family:"Comic Sans MS","Bradley Hand",cursive; font-size:clamp(2rem,4vw,4.1rem); font-weight:400; letter-spacing:-.08em; line-height:1; transform:rotate(-1deg); }
    .section-heading::after { content:""; position:absolute; left:-2%; right:-8%; bottom:-12px; height:12px; border-bottom:2px solid var(--line); border-radius:50%; transform:rotate(1deg); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(24px,5vw,76px); }
    .project { display:block; }
    .video-frame { position:relative; aspect-ratio:16/9; overflow:hidden; border:2px solid var(--line); background:#282828; box-shadow:4px 5px 0 rgba(23,23,23,.08); transform:rotate(-.4deg); }
    .project:nth-child(2) .video-frame { transform:rotate(.35deg); }
    .video-frame iframe { width:100%; height:100%; border:0; filter:grayscale(1) contrast(1.05); pointer-events:none; }
    .video-frame::after { content:""; position:absolute; inset:0; border:1px solid rgba(242,238,229,.45); pointer-events:none; }
    .play { position:absolute; left:50%; top:50%; display:grid; place-items:center; width:58px; height:58px; border:2px solid var(--ink); border-radius:50%; background:rgba(242,238,229,.86); transform:translate(-50%,-50%); font-size:25px; z-index:2; transition:transform .2s ease, background .2s ease; }
    .project:hover .play { background:#fff; transform:translate(-50%,-50%) scale(1.12) rotate(-7deg); }
    .project-name { display:flex; justify-content:space-between; gap:18px; margin-top:15px; font-family:"Comic Sans MS","Bradley Hand",cursive; font-size:clamp(1.2rem,2vw,2rem); letter-spacing:-.04em; }
    .project-number { font-family:Arial,Helvetica,sans-serif; font-size:11px; letter-spacing:.15em; opacity:.55; padding-top:7px; }
    .back { position:fixed; left:5vw; bottom:24px; z-index:6; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .back::before { content:"←"; display:inline-block; margin-right:8px; font-size:18px; vertical-align:-2px; }
    @media (max-width:700px) { header { padding:18px 5vw 0; } .brand { font-size:25px; } .work-title { font-size:clamp(2.9rem,13vw,5rem); } main { padding:10vh 5vw 100px; } .section { margin-bottom:76px; } .grid { grid-template-columns:1fr; gap:36px; } .scratch { bottom:-28px; } }
  </style>
</head>
<body>

          <div class="project-name"><span>Motion Study / 01</span><span class="project-number">01</span></div>

        <a class="project" href="https://www.youtube.com/watch?v=SCAX6c7GhDw" target="_blank" rel="noreferrer">

          <div class="project-name"><span>Motion Study / 02</span><span class="project-number">02</span></div>

</html>
